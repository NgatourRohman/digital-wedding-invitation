<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="description"
        content="Undangan pernikahan digital Hari & Diah. Mari rayakan kebahagiaan bersama kami." />
    <meta property="og:title" content="Hari & Diah - Wedding Invitation" />
    <meta property="og:description"
        content="Dengan memohon rahmat dan ridho Allah SWT, kami bermaksud menyelenggarakan pernikahan putra-putri kami. Mari rayakan kebahagiaan bersama kami." />
    <meta property="og:image"
        content="https://ngatourrohman.github.io/digital-wedding-invitation/assets/images/wedding-invitation-preview.png" />
    <meta property="og:url" content="https://ngatourrohman.github.io/digital-wedding-invitation/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hari & Diah Wedding" />
    <meta property="og:locale" content="id_ID" />
    <title>Hari & Diah – Wedding Invitation</title>
    <link rel="icon" type="image/png" href="assets/images/wedding logo.png" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Quicksand:wght@300;400;500&amp;display=swap"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'inv-bg': '#F8F5F2',
                        'inv-primary': '#3C2A21',
                        'inv-accent': '#A68A73',
                    },
                    fontFamily: {
                        'organic': ['"Playfair Display"', 'serif'],
                        'body': ['"Quicksand"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-soft': 'pulse-soft 4s ease-in-out infinite',
                        'bloom': 'bloom 2s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': {
                                transform: 'translateY(0)'
                            },
                            '50%': {
                                transform: 'translateY(-20px)'
                            },
                        },
                        'pulse-soft': {
                            '0%, 100%': {
                                opacity: 0.8
                            },
                            '50%': {
                                opacity: 1
                            },
                        },
                        bloom: {
                            '0%': {
                                opacity: 0,
                                transform: 'scale(0.95)'
                            },
                            '100%': {
                                opacity: 1,
                                transform: 'scale(1)'
                            },
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/index.css" />
</head>

<body class="font-body text-inv-primary min-h-screen flex items-center justify-center relative overflow-x-hidden">
    <div class="fixed inset-0 organic-gradient z-0"></div>
    <div
        class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-inv-accent opacity-10 rounded-full blur-[100px] animate-float">
    </div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-inv-primary opacity-5 rounded-full blur-[120px] animate-float"
        style="animation-delay: 2s;"></div>

    <main
        class="relative z-10 w-full max-w-4xl px-4 sm:px-6 py-8 sm:py-12 flex flex-col items-center justify-center animate-bloom">
        <div class="relative w-full max-w-2xl mb-8 sm:mb-12 group px-2">
            <div class="relative overflow-hidden rounded-3xl shadow-2xl border border-white/20 animate-pulse-soft">
                <img alt="Ilustrasi Hari & Diah"
                    class="w-full h-auto object-cover transform transition-transform duration-700 group-hover:scale-105"
                    src="assets/images/wedding-invitation.png" loading="lazy" />
            </div>
            <div
                class="absolute -top-3 -left-3 sm:-top-4 sm:-left-4 w-16 h-16 sm:w-24 sm:h-24 border-t-2 border-l-2 border-inv-accent opacity-30 rounded-tl-[40px]">
            </div>
            <div
                class="absolute -bottom-3 -right-3 sm:-bottom-4 sm:-right-4 w-16 h-16 sm:w-24 sm:h-24 border-b-2 border-r-2 border-inv-accent opacity-30 rounded-br-[40px]">
            </div>
        </div>

        <section class="text-center space-y-4 sm:space-y-6">
            <p
                class="uppercase tracking-[0.3em] text-inv-accent font-medium text-xs sm:text-sm md:text-base mb-1 sm:mb-2">
                The Wedding Of</p>
            <h1 class="font-organic text-4xl sm:text-5xl md:text-7xl lg:text-8xl leading-tight mb-2 sm:mb-4">
                HARI <span class="italic text-inv-accent">&amp;</span> DIAH
            </h1>
            <div class="w-12 sm:w-16 h-[1px] bg-inv-accent mx-auto my-4 sm:my-6 opacity-50"></div>
            <p class="text-base sm:text-lg md:text-xl font-light tracking-wide max-w-md mx-auto italic opacity-80 px-2">
                "Love is a living thing, growing in the garden of time."
            </p>

            <div class="mt-8 sm:mt-12 flex flex-col items-center">
                <button
                    class="morph-btn px-8 sm:px-10 py-6 sm:py-8 bg-inv-accent text-white font-medium tracking-[0.2em] uppercase text-xs sm:text-sm shadow-xl hover:shadow-2xl transition-all duration-300 flex flex-col items-center justify-center"
                    id="openInvitation">
                    <span>Open</span>
                    <span class="text-[8px] sm:text-[10px] mt-1 opacity-80">Invitation</span>
                </button>
            </div>
        </section>

        <section class="relative py-20 px-4 overflow-hidden bg-gradient-to-b from-wedding-bg to-wedding-bg/80">
            <div class="absolute top-0 left-0 w-48 h-48 md:w-96 md:h-96 opacity-10 pointer-events-none">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M44.7,-76.4C58.1,-69.2,69.5,-57.4,77.3,-43.7C85.1,-30,89.2,-15,88.4,-0.5C87.5,14.1,81.8,28.1,73.4,40.8C65,53.5,54,64.8,40.8,71.7C27.7,78.6,12.3,81.1,-2.4,85.3C-17.1,89.5,-31.1,95.4,-44.6,90.4C-58.1,85.4,-71.1,69.5,-79.1,52.3C-87.1,35,-90.1,16.5,-88.4,0.1C-86.7,-16.3,-80.4,-30.6,-70.8,-42.1C-61.2,-53.6,-48.3,-62.4,-35,-69.6C-21.7,-76.8,-8.1,-82.4,3.7,-88.8C15.4,-95.2,28.7,-83.6,44.7,-76.4Z"
                        fill="#BCA38B" transform="translate(100 100)" />
                </svg>
            </div>
            <div class="absolute bottom-0 right-0 w-64 h-64 md:w-80 md:h-80 opacity-10 pointer-events-none">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M42.7,-72.1C55.9,-65.7,67.6,-54.3,75.4,-40.7C83.2,-27.1,87.1,-11.3,85.8,3.9C84.4,19.1,77.8,33.7,68.4,45.8C59,57.9,46.8,67.6,33.3,73.1C19.7,78.6,4.8,79.9,-10.1,78.3C-24.9,76.6,-39.8,72,-52.3,63.2C-64.8,54.4,-75,41.4,-80.4,26.7C-85.8,11.9,-86.4,-4.6,-82.1,-19.6C-77.8,-34.6,-68.6,-48.1,-56.3,-54.9C-44,-61.7,-28.7,-61.8,-14.8,-68.1C-0.9,-74.5,11.5,-87,27.1,-84.9C42.7,-82.8,42.7,-72.1,42.7,-72.1Z"
                        fill="#BCA38B" transform="translate(100 100)" />
                </svg>
            </div>

            <div class="relative z-10 max-w-4xl mx-auto text-center">
                <h2 class="font-serif text-3xl md:text-4xl text-wedding-text mb-2 animate-fade-in-up">Catat Tanggalnya</h2>
                <p class="text-sm md:text-base text-wedding-text/70 mb-8 md:mb-12 animate-fade-in-up"
                    style="animation-delay: 0.1s;">Kami tidak sabar merayakan momen istimewa ini bersama Anda</p>

                <div
                    class="glass-card rounded-2xl p-8 md:p-12 max-w-3xl mx-auto shadow-xl transform transition-all duration-500 hover:scale-[1.02]">
                    <div class="grid grid-cols-4 gap-2 md:gap-8">
                        <div class="flex flex-col items-center">
                            <span class="text-3xl md:text-5xl lg:text-6xl font-serif text-wedding-text"
                                id="cd-days">00</span>
                            <span class="text-[10px] uppercase tracking-[0.2em] mt-2 text-wedding-text/60">Hari</span>
                        </div>
                        <div class="flex flex-col items-center border-l border-wedding-accent/30">
                            <span class="text-3xl md:text-5xl lg:text-6xl font-serif text-wedding-text"
                                id="cd-hours">00</span>
                            <span class="text-[10px] uppercase tracking-[0.2em] mt-2 text-wedding-text/60">Jam</span>
                        </div>
                        <div class="flex flex-col items-center border-l border-wedding-accent/30">
                            <span class="text-3xl md:text-5xl lg:text-6xl font-serif text-wedding-text"
                                id="cd-minutes">00</span>
                            <span class="text-[10px] uppercase tracking-[0.2em] mt-2 text-wedding-text/60">Menit</span>
                        </div>
                        <div class="flex flex-col items-center border-l border-wedding-accent/30">
                            <span class="text-3xl md:text-5xl lg:text-6xl font-serif text-wedding-text"
                                id="cd-seconds">00</span>
                            <span class="text-[10px] uppercase tracking-[0.2em] mt-2 text-wedding-text/60">Detik</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="js/index.js"></script>
</body>

</html>
